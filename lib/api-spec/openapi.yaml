openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Typed customer-facing API for the Nomilora Phase 1 demo.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: meals
    description: Illustrative customer meal catalog
  - name: recommendations
    description: Deterministic demo personalization
  - name: checkout
    description: No-charge checkout simulation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /meals:
    get:
      operationId: listMeals
      tags: [meals]
      summary: List illustrative meals
      responses:
        "200":
          description: The demo meal catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Meal"
  /meals/{mealId}:
    get:
      operationId: getMeal
      tags: [meals]
      summary: Get a meal by identifier
      parameters:
        - name: mealId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The illustrative meal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meal"
        "404":
          description: Meal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /launch-readiness:
    get:
      operationId: getLaunchReadiness
      tags: [meals]
      summary: Get configured delivery and payment status
      responses:
        "200":
          description: Current launch readiness; no pilot areas are enabled by default
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaunchReadiness"
  /recommendations:
    post:
      operationId: getRecommendations
      tags: [recommendations]
      summary: Recommend illustrative meals from quiz preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationInput"
      responses:
        "200":
          description: Deterministic preference matches and allergen safety notice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
        "400":
          description: Invalid preference input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /demo-checkouts:
    post:
      operationId: simulateDemoCheckout
      tags: [checkout]
      summary: Validate a basket and simulate a zero-charge checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoCheckoutInput"
      responses:
        "200":
          description: A clearly marked checkout simulation with no charge or real order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoCheckoutSimulation"
        "400":
          description: Invalid basket or demo acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /account:
    get:
      operationId: getCustomerAccount
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccount'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permission or unverified email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Account service not configured or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /account/profile:
    put:
      operationId: updateCustomerProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerProfileInput'
      responses:
        '204':
          description: Saved
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permission or unverified email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Account service not configured or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /account/preferences:
    put:
      operationId: updateCustomerPreferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationInput'
      responses:
        '204':
          description: Saved
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permission or unverified email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Account service not configured or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /account/cart:
    put:
      operationId: replaceCustomerCart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCartInput'
      responses:
        '204':
          description: Saved
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permission or unverified email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Account service not configured or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /account/favorites/{mealId}:
    parameters:
      - name: mealId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: saveCustomerMeal
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Saved
        '400':
          description: Invalid input
          content:
