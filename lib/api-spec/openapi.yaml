        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Account service not configured or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /account/access/partner:
    get:
      operationId: checkPartnerAccess
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                required:
                  - allowed
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permission or unverified email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Account service not configured or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Meal:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        priceCents:
          type: integer
          minimum: 0
        photoUrl:
          type: string
        cuisine:
          type: string
        mealType:
          type: string
        category:
          type: string
        dietaryTags:
          type: array
          items:
            type: string
        ingredients:
          type: array
          items:
            type: string
        allergens:
          type: array
          items:
            type: string
        dietaryStatus:
          type: string
          enum: [unverified, verified]
        allergenStatus:
          type: string
          enum: [unverified]
        nutritionStatus:
          type: string
          enum: [unverified]
        portion:
          type: string
        storage:
          type: string
        reheating:
          type: string
        featured:
          type: boolean
        demoOnly:
          type: boolean
      required:
        - id
        - name
        - description
        - priceCents
        - photoUrl
        - cuisine
        - mealType
        - category
        - dietaryTags
        - ingredients
        - allergens
        - dietaryStatus
        - allergenStatus
        - nutritionStatus
        - portion
        - storage
        - reheating
        - featured
        - demoOnly
    LaunchReadiness:
      type: object
      properties:
        mode:
          type: string
          enum: [demo]
        plannedAreas:
          type: array
          items:
            type: string
        activeDeliveryZones:
          type: array
          items:
            type: string
        deliveryEnabled:
          type: boolean
        paymentsEnabled:
          type: boolean
        weeklyPlanBillingEnabled:
          type: boolean
        notice:
          type: string
      required:
        - mode
        - plannedAreas
        - activeDeliveryZones
        - deliveryEnabled
        - paymentsEnabled
        - weeklyPlanBillingEnabled
        - notice
    RecommendationInput:
      type: object
      properties:
        eatingStyles:
          type: array
          items:
            type: string
            enum:
              - Everything
              - Vegan
              - Vegetarian
              - Pescatarian
              - High Protein
              - Halal preference
              - Kosher preference
              - Low Carb
              - Keto
              - Dairy avoidance
              - Gluten avoidance
              - Soups or blended meals
        goals:
          type: array
          items:
            type: string
            enum:
              - Convenience
              - Delicious everyday meals
              - Balanced meals
              - More protein
              - More vegetables
              - Discover new cuisines
              - Family meals
        cuisines:
          type: array
          items:
            type: string
            enum:
              - American
              - Italian
              - Mediterranean
              - Middle Eastern
              - Mexican
              - Indian
              - Japanese
              - Korean
              - Chinese-inspired
              - Other
        strictAllergens:
          type: array
          items:
            type: string
            enum:
              - Milk
              - Egg
              - Fish
              - Crustacean shellfish
              - Tree nuts
              - Peanuts
              - Wheat
              - Soy
              - Sesame
        dislikes:
          type: array
          items:
            type: string
        preferredMealTypes:
          type: array
          maxItems: 4
          items:
            type: string
            enum: [Breakfast, Lunch, Dinner, Soup or light meal]
        mealsPerWeek:
          type: string
          enum:
            - One-time
            - 3–4
            - 5–7
            - 8–10
            - 10+
      required:
        - eatingStyles
        - goals
        - cuisines
        - strictAllergens
        - dislikes
        - mealsPerWeek
    Recommendation:
      type: object
      properties:
        mealId:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        reasons:
          type: array
          items:
            type: string
      required: [mealId, score, reasons]
    RecommendationResponse:
      type: object
      properties:
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/Recommendation"
        allergenNotice:
          type: string
        preferenceSummary:
          type: string
      required: [recommendations, allergenNotice, preferenceSummary]
    DemoCheckoutItemInput:
      type: object
      properties:
        mealId:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 20
      required: [mealId, quantity]
    DemoCheckoutInput:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DemoCheckoutItemInput"
        acknowledgedDemoOnly:
          type: boolean
          enum: [true]
      required: [items, acknowledgedDemoOnly]
    DemoCheckoutLine:
      type: object
      properties:
        mealId:
          type: string
        name:
          type: string
        quantity:
          type: integer
        unitPriceCents:
          type: integer
        lineTotalCents:
          type: integer
      required: [mealId, name, quantity, unitPriceCents, lineTotalCents]
    DemoCheckoutSimulation:
      type: object
      properties:
        demoId:
          type: string
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [simulated]
        paymentStatus:
          type: string
          enum: [not_charged]
        itemCount:
          type: integer
        subtotalCents:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/DemoCheckoutLine"
        message:
          type: string
      required:
        - demoId
        - createdAt
        - status
        - paymentStatus
        - itemCount
        - subtotalCents
        - items
        - message


    ApplicationRole:
      type: string
      enum:
        - customer
        - restaurant_employee
        - restaurant_manager
        - support_agent
        - operations_admin
        - founder_admin
    CustomerProfileInput:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          maxLength: 200
        phoneNumber:
          type: string
          maxLength: 30
      required:
        - displayName
        - phoneNumber
    CustomerCartInput:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            properties:
              mealId:
                type: string
                maxLength: 100
                pattern: ^[a-z0-9-]+$
              quantity:
                type: integer
                minimum: 1
                maximum: 20
            required:
              - mealId
              - quantity
      required:
        - items
    CustomerAddressInput:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          maxLength: 200
          minLength: 1
        recipientName:
          type: string
          maxLength: 200
          minLength: 1
        phoneNumber:
          type: string
          maxLength: 30
        street1:
          type: string
          maxLength: 200
          minLength: 1
        street2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 200
          minLength: 1
        region:
          type: string
          pattern: ^[A-Z]{2}$
        postalCode:
          type: string
          pattern: ^\d{5}(-\d{4})?$
        countryCode:
          type: string
          enum:
            - US
        deliveryInstructions:
          type: string
          maxLength: 500
        isDefault:
          type: boolean
      required:
        - label
        - recipientName
        - street1
        - city
        - region
        - postalCode
    AddressId:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id
    SavedCustomerAddress:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          maxLength: 200
          minLength: 1
        recipientName:
          type: string
          maxLength: 200
          minLength: 1
        phoneNumber:
          type: string
          maxLength: 30
        street1:
          type: string
          maxLength: 200
          minLength: 1
        street2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 200
          minLength: 1
        region:
          type: string
          pattern: ^[A-Z]{2}$
        postalCode:
          type: string
          pattern: ^\d{5}(-\d{4})?$
        countryCode:
          type: string
          enum:
            - US
        deliveryInstructions:
          type: string
          maxLength: 500
        isDefault:
          type: boolean
        id:
          type: string
          format: uuid
      required:
        - label
        - recipientName
        - street1
        - city
        - region
        - postalCode
        - id
    CustomerAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        displayName:
          type: string
          maxLength: 200
        phoneNumber:
          type: string
          maxLength: 30
        roles:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationRole'
        preferences:
          $ref: '#/components/schemas/RecommendationInput'
        cart:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 20
        favorites:
          type: array
          items:
            type: string
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/SavedCustomerAddress'
      required:
        - id
        - email
        - displayName
        - phoneNumber
        - roles
        - preferences
        - cart
        - favorites
        - addresses
