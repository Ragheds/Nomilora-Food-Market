<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#103D26" />
    <title>Nomilora is offline</title>
    <style>
      :root { color-scheme: light; font-family: "DM Sans", Arial, sans-serif; background: #fcf4e9; color: #303030; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 480px); padding: 32px; border: 1px solid #ded9cc; border-radius: 24px; background: #fffdf8; text-align: center; }
      img { width: min(100%, 220px); height: auto; }
      h1 { color: #103d26; font-family: Georgia, serif; font-size: 2rem; font-weight: 500; }
      p { line-height: 1.7; color: #647064; }
      a { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 999px; background: #103d26; color: #fcf4e9; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/02_nomilora_stacked_transparent.png" alt="Nomilora" />
      <h1>You’re offline</h1>
      <p>The menu preview needs a connection to load. Your saved basket and preferences stay on this device. No order or payment can be completed offline.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
