kind = "web"
previewPath = "/"
title = "Nomilora"
description = "A mobile-first customer experience for exploring personalized chef-prepared meals, saving preferences, building a basket, and trying a no-charge demo checkout."
version = "1.0.0"
id = "artifacts/nomilora"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18352

[services.development]
run = "pnpm --filter @workspace/nomilora run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nomilora", "run", "build" ]
serve = "static"
publicDir = "artifacts/nomilora/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18352"
BASE_PATH = "/"
